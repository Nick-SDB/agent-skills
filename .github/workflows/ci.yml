name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python tools and tests
        run: python -m py_compile tools/skillctl.py tools/build_release.py tests/*.py
      - name: Validate repository
        run: python tools/skillctl.py validate
      - name: Verify deterministic rendering
        run: |
          python tools/skillctl.py render --target all --output dist
          python tools/skillctl.py render --target all --output dist --check
      - name: Run test suite
        run: python -m unittest discover -s tests -v
